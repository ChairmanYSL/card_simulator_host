[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emv-host"
version = "0.1.0"
description = "EMV auto-test host: TCP device hub (Android card simulator + POS) with web UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
card_simulator_host = "emv_host.cli:main"

[tool.setuptools.packages.find]
include = ["emv_host*"]
